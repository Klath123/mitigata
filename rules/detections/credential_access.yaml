# Rule format (all rule files):
#   id, title, technique, sub_technique, tactic, severity (info|low|medium|high|critical), kind
#   sql: a SELECT over the `events` view returning event rows (use e.*). Optional extra columns
#        override per row: hit_key (groups evidence into one hit), hit_host, hit_user,
#        technique, sub_technique, tactic, hit_severity (0-1 number).
rules:
  - id: lsass_access
    title: LSASS memory accessed by a non-system process
    technique: T1003
    sub_technique: T1003.001
    tactic: Credential Access
    severity: high
    kind: known_bad
    sql: |
      SELECT e.* FROM events e
      WHERE e.event_type = 'sysmon:10' AND bn(e.target) = 'lsass.exe'
        AND bn(e.process) NOT IN ('msmpeng.exe','csrss.exe','wininit.exe','lsm.exe','svchost.exe','mrt.exe',
                                  'wmiprvse.exe','vmtoolsd.exe','senseir.exe','mssense.exe','taskmgr.exe',
                                  'lsass.exe','services.exe','smartscreen.exe')

  - id: lsass_dump_tool
    title: LSASS dump via comsvcs/ProcDump/mimikatz command line
    technique: T1003
    sub_technique: T1003.001
    tactic: Credential Access
    severity: critical
    kind: known_bad
    sql: |
      SELECT e.* FROM events e
      WHERE is_proc(e.event_type) AND (
            regexp_matches(lc(e.cmdline), 'comsvcs(\.dll)?[, ]+#?(minidump|24)')
         OR regexp_matches(lc(e.cmdline), '(-ma|/ma)\s+(lsass|\d+)')  AND regexp_matches(lc(e.cmdline), 'lsass|\.dmp')
         OR regexp_matches(lc(e.cmdline), 'sekurlsa|lsadump::|kerberos::|privilege::debug')
         OR regexp_matches(lc(e.cmdline), 'nanodump|out-minidump|dumpert|pypykatz'))

  - id: lsass_dump_file
    title: Memory dump file written (lsass / temp .dmp by a non-crash-handler)
    technique: T1003
    sub_technique: T1003.001
    tactic: Credential Access
    severity: high
    kind: known_bad
    sql: |
      SELECT e.* FROM events e
      WHERE e.event_type = 'sysmon:11' AND lc(e.target) LIKE '%.dmp'
        AND bn(e.process) NOT IN ('werfault.exe','wermgr.exe','taskmgr.exe','svchost.exe')
        AND (lc(e.target) LIKE '%lsass%' OR bn(e.process) IN ('rundll32.exe','procdump.exe','procdump64.exe',
             'pd64.exe','powershell.exe','cmd.exe') OR regexp_matches(lc(e.target), '\\(temp|public|programdata)\\'))

  - id: creds_in_files
    title: Credential/config file read by a shell utility instead of the application
    technique: T1552
    sub_technique: T1552.001
    tactic: Credential Access
    severity: high
    kind: known_bad
    sql: |
      SELECT e.* FROM events e
      WHERE (e.event_type IN ('audit:read','sysmon:11') OR is_proc(e.event_type))
        AND regexp_matches(lc(coalesce(e.target, '') || ' ' || coalesce(e.cmdline, '')),
            '(\.env\b|wp-config\.php|/config/[^ ]*\.(ini|php|ya?ml|json|conf)|web\.config|\.kdbx|id_rsa|/etc/shadow|'
            '\.git-credentials|unattend\.xml|\.aws/credentials|appsettings\.json|\.pgpass|\.my\.cnf)')
        AND bn(e.process) NOT IN ('php-fpm','php-fpm7.4','php-fpm8.0','php-fpm8.1','php-fpm8.2','php','apache2',
                                  'httpd','nginx','java','node','w3wp.exe','dotnet','dotnet.exe','sshd','gunicorn',
                                  'uwsgi','postgres','mysqld','backup','rsync','tar')
        AND (e.event_type <> 'audit:execve' OR regexp_matches(lc(e.cmdline), '^(cat|less|more|head|tail|grep|strings|vi|vim|nano|cp|scp|base64|xxd|type|findstr)\b'))

  - id: password_search
    title: Searching files for passwords
    technique: T1552
    sub_technique: T1552.001
    tactic: Credential Access
    severity: medium
    kind: known_bad
    sql: |
      SELECT e.* FROM events e
      WHERE is_proc(e.event_type)
        AND regexp_matches(lc(e.cmdline), '(findstr|grep|select-string).*(password|passwd|pwd=|credential)')
