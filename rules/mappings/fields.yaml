# Field mapping: raw field names -> normalized event fields.
#
# Every parser flattens a record into dotted keys (e.g. Event.EventData.TargetUserName,
# winlog.event_data.Image, id.orig_h). For each normalized field, aliases are tried in
# order and the first one with a usable value wins.
#   - an alias WITHOUT a dot matches the last path segment (case-insensitive): "Image"
#   - an alias WITH a dot matches the end of the path: "host.name" matches "x.host.name"
# Supporting a new log source usually needs only new aliases here.

fields:
  ts: [SystemTime, "@timestamp", timestamp, UtcTime, TimeCreated, time_generated, TimeGenerated,
       EventTime, eventtime, datetime, date_time, ts, rt, start, starttime, time, _time, devTime, Date]
  action_type: [event.action, action_type]
  event_id: [EventID, event_id, event.code, EventCode, eventid, event_code, signature_id, cs1, EventIdentifier]
  channel: [Channel, winlog.channel, channel, log_name, LogName, SourceName, provider_name]
  provider: [Provider.Name, event.provider, winlog.provider_name, provider]
  host: [Computer, computer_name, host.name, hostname, host_name, Host Name, ComputerName, dvchost, dhost_reporter,
         s-computername, devname, device_name, observer.name, agent.hostname, Hostname, host]
  host_ip: [host_ip, dvc, host.ip, agent.ip, s-ip_reporter, IP Address, devip]
  user: [TargetUserName, SubjectUserName, User, user.name, UserName, username, user, usr, suser, duser,
         cs-username, AccountName, account, Account_Name, src_user, srcuser, usrName, uid_name, login, SourceUser]
  domain: [TargetDomainName, SubjectDomainName, user.domain, domain, Domain, suser_domain]
  src_ip: [IpAddress, SourceIp, SourceAddress, src_ip, srcip, src, source.ip, id.orig_h, c-ip, client_ip, clientip,
           ClientAddress, remote_addr, remote_ip, ip_src, source_address, s_ip, addr, SourceIP]
  src_port: [IpPort, SourcePort, src_port, srcport, spt, source.port, id.orig_p, sport, SourcePortNumber]
  dst_ip: [DestinationIp, DestAddress, dst_ip, dstip, dst, destination.ip, id.resp_h, s-ip, server_ip,
           ip_dst, destination_address, d_ip, DestinationIP, dns.resolved_ip]
  dst_port: [DestinationPort, DestPort, dst_port, dstport, dpt, destination.port, id.resp_p, s-port, dport]
  dst_host: [DestinationHostname, TargetServerName, dst_host, dhost, destination.domain, dns.question.name, query,
             cs-host, dsthost]
  src_host: [WorkstationName, Workstation, src_host, shost, source.domain, client_name, srchost, SourceHostname]
  proto: [Protocol, proto, protocol, transport, network.transport]
  action: [action, act, Action, outcome, event.outcome, disposition, cs-method, method, deviceAction]
  logon_type: [LogonType, logon_type, logontype, Logon_Type, logon.type, winlog.logon.type]
  logon_id: [TargetLogonId, SubjectLogonId, LogonId, logon_id, ses]
  process: [Image, NewProcessName, SourceImage, ProcessName, process.executable, process_path, exe, Application,
            process_name, deviceProcessName, sproc, proc, process, process.name]
  process_guid: [ProcessGuid, SourceProcessGuid, process.entity_id, process_guid]
  pid: [ProcessId, NewProcessId, SourceProcessId, process.pid, pid, spid]
  ppid: [ParentProcessId, process.parent.pid, ppid, ProcessId_parent]
  parent: [ParentImage, ParentProcessName, process.parent.executable, parent_process, parent_image, parent,
           process.parent.name]
  parent_guid: [ParentProcessGuid, process.parent.entity_id, parent_guid]
  cmdline: [CommandLine, process.command_line, cmdline, command_line, CommandLineArgs, Details, cmd, command,
            ImagePath, registry.data.strings]
  parent_cmdline: [ParentCommandLine, process.parent.command_line, parent_command_line, parent_cmdline]
  original_file_name: [OriginalFileName, process.pe.original_file_name, original_file_name, OriginalFilename]
  hashes: [Hashes, Hash, process.hash.sha256, file.hash.sha256, sha256, SHA256, hashes, md5, MD5]
  integrity_level: [IntegrityLevel, process.integrity_level, integrity_level, MandatoryLabel]
  image_loaded: [ImageLoaded, dll.path, file.path_loaded, image_loaded]
  signed: [Signed, signed, dll.code_signature.trusted, SignatureStatus, dll.code_signature.status]
  ticket_encryption: [TicketEncryptionType, ticket_encryption, winlog.event_data.TicketEncryptionType]
  target: [TargetFilename, TargetObject, TargetImage, ObjectName, ShareName, TaskName, ServiceName, QueryName, PipeName,
           file.path, registry.path, dns.question.name, file_path, filename, fname, cs-uri-stem, uri, url, request, url.original, path, target]
  target_guid: [TargetProcessGuid, target_guid]
  target_user: [target_user, MemberName, SamAccountName, duser_target]
  group: [GroupName, group, group_name]
  bytes_out: [bytes_out, bytes_sent, sentbyte, sent_bytes, out, orig_bytes, sc-bytes_out, cs-bytes, BytesSent,
              source.bytes, client_bytes, bytes_toserver, SentBytes, network.bytes]
  bytes_in: [bytes_in, bytes_received, rcvdbyte, rcvd_bytes, in, resp_bytes, sc-bytes, BytesReceived,
             destination.bytes, server_bytes, bytes_toclient, ReceivedBytes]
  status: [Status, status, sc-status, http.response.status_code, result, Result, response_code, conn_state]
  severity: [rule.severity, severity, level, Level, priority, Severity, RuleLevel, rule.level]
  rule: [rule.name, RuleTitle, rule.name, rule_name, signature, alert, rule.description, RuleName, rule]
  message: [ScriptBlockText, message, msg, Message, user_agent, cs(User-Agent), useragent, http.user_agent, Payload,
            payload, description, Description]

# Per event-type overrides (applied after the generic pass). Values are alias lists
# just like above; an empty list clears the field.
event_overrides:
  "win:4624": {user: [TargetUserName], logon_id: [TargetLogonId]}
  "win:4625": {user: [TargetUserName]}
  "win:4634": {user: [TargetUserName], logon_id: [TargetLogonId]}
  "win:4648": {user: [SubjectUserName], target_user: [TargetUserName], dst_host: [TargetServerName]}
  "win:4672": {user: [SubjectUserName], logon_id: [SubjectLogonId]}
  "win:4688": {user: [SubjectUserName], logon_id: [SubjectLogonId], process: [NewProcessName],
               parent: [ParentProcessName], pid: [NewProcessId]}
  "win:4698": {user: [SubjectUserName], target: [TaskName], cmdline: [TaskContent]}
  "win:4702": {user: [SubjectUserName], target: [TaskName], cmdline: [TaskContentNew]}
  "win:4720": {user: [SubjectUserName], target_user: [TargetUserName, SamAccountName]}
  "win:4722": {user: [SubjectUserName], target_user: [TargetUserName]}
  "win:4724": {user: [SubjectUserName], target_user: [TargetUserName]}
  "win:4726": {user: [SubjectUserName], target_user: [TargetUserName]}
  "win:4728": {user: [SubjectUserName], group: [TargetUserName], target_user: [MemberName]}
  "win:4732": {user: [SubjectUserName], group: [TargetUserName], target_user: [MemberName]}
  "win:4756": {user: [SubjectUserName], group: [TargetUserName], target_user: [MemberName]}
  "win:4769": {user: [TargetUserName], target: [ServiceName]}
  "win:4768": {user: [TargetUserName], target: [ServiceName]}
  "win:4776": {user: [TargetUserName], src_host: [Workstation]}
  "win:5140": {user: [SubjectUserName], target: [ShareName]}
  "win:5145": {user: [SubjectUserName], target: [RelativeTargetName, ShareName]}
  "win:7045": {user: [], target: [ServiceName], process: [ImagePath], cmdline: [ImagePath]}
  "win:4697": {user: [SubjectUserName], target: [ServiceName], process: [ServiceFileName], cmdline: [ServiceFileName]}
  "win:1102": {user: [SubjectUserName]}
  "sysmon:3": {src_host: [], dst_host: [DestinationHostname]}
  "sysmon:10": {user: [SourceUser], process: [SourceImage], process_guid: [SourceProcessGuid], pid: [SourceProcessId],
                target: [TargetImage]}
  "sysmon:13": {target: [TargetObject], cmdline: [Details]}
  "sysmon:22": {target: [QueryName], dst_host: [QueryName]}
  "ps:4104": {cmdline: [], message: [ScriptBlockText]}

# Event-type from an action/category field when the record has no numeric event id (ECS EDRs,
# Elastic Defend, CrowdStrike-style exports...). Keys are matched case-insensitively against
# event.action / event_type-like fields. Values reuse the Sysmon-equivalent types the rules know.
action_event_types:
  process_created: "sysmon:1"
  process_start: "sysmon:1"
  start: "sysmon:1"
  processrollup2: "sysmon:1"
  exec: "audit:execve"
  network_connection: "sysmon:3"
  connection_attempted: "sysmon:3"
  networkconnectip4: "sysmon:3"
  dns_query: "sysmon:22"
  lookup_result: "sysmon:22"
  dnsrequest: "sysmon:22"
  file_created: "sysmon:11"
  file_create: "sysmon:11"
  creation: "sysmon:11"
  file_modified: "sysmon:11"
  modification: "sysmon:11"
  file_rename: "sysmon:11"
  rename: "sysmon:11"
  registry_value_set: "sysmon:13"
  modification_registry: "sysmon:13"
  registry_key_created: "sysmon:12"
  process_access: "sysmon:10"
  image_load: "sysmon:7"
  user_logon: "auth:logon"
  logon_success: "auth:success"
  logon_failed: "auth:fail"

# Windows logon type names -> numbers
logon_type_names: {interactive: 2, network: 3, batch: 4, service: 5, unlock: 7, networkcleartext: 8,
                   newcredentials: 9, remoteinteractive: 10, cachedinteractive: 11, rdp: 10}

# Channel/provider substring -> event_type prefix for Windows-style records with an event id.
channel_prefix:
  sysmon: sysmon
  powershell: ps
  security: win
  system: win
  "service control manager": win
  default: win

# Semantic extraction from free-text messages (syslog, generic lines). Named groups must be
# normalized field names; `program` (optional) is matched against the syslog program name.
message_patterns:
  - {program: sshd, event_type: "auth:fail", action: failure,
     regex: 'Failed (?:password|publickey|keyboard-interactive/pam|none) for (?:invalid user )?(?P<user>\S+) from (?P<src_ip>[\d.:a-fA-F]+)(?: port (?P<src_port>\d+))?'}
  - {program: sshd, event_type: "auth:success", action: success,
     regex: 'Accepted (?:password|publickey|keyboard-interactive/pam|gssapi-with-mic) for (?P<user>\S+) from (?P<src_ip>[\d.:a-fA-F]+)(?: port (?P<src_port>\d+))?'}
  - {program: sshd, event_type: "auth:invalid_user", action: failure,
     regex: 'Invalid user (?P<user>\S+) from (?P<src_ip>[\d.:a-fA-F]+)(?: port (?P<src_port>\d+))?'}
  - {program: sshd, event_type: "net:listen", regex: 'Server listening on (?P<host_ip>[\d.]+) port'}
  - {program: sudo, event_type: "auth:sudo", action: success,
     regex: '^\s*(?P<user>\S+) : .*?USER=(?P<target_user>\S+) ; COMMAND=(?P<cmdline>.+)$'}
  - {program: sudo, event_type: "auth:sudo_fail", action: failure,
     regex: '^\s*(?P<user>\S+) : (?:\d+ incorrect password attempts|user NOT in sudoers)'}
  - {event_type: "auth:session_open", regex: 'session opened for user (?P<user>[^\s(]+)'}
  - {event_type: "auth:session_close", regex: 'session closed for user (?P<user>[^\s(]+)'}
  - {program: useradd, event_type: "account:create", regex: 'new user: name=(?P<target_user>[^,\s]+)'}
  - {program: usermod, event_type: "account:group_add", regex: "add '(?P<target_user>[^']+)' to (?:shadow )?group '(?P<group>[^']+)'"}
  - {program: dhclient, event_type: "dhcp:bound", regex: 'bound to (?P<host_ip>[\d.]+)'}
  - {event_type: "auth:fail", action: failure,
     regex: 'authentication failure;.*?rhost=(?P<src_ip>[\d.]+)?.*?user=(?P<user>\S+)'}

# Event semantics: give a canonical type to records whose format is unknown but whose MEANING is
# recognisable from field values. Applied only when no event id / parser / pattern typed the record.
# Every rule needs ALL of its conditions: a context condition (what operation) AND an outcome condition,
# so `status=failed` alone never becomes a login failure.
#   fields: source field names (leaf, case-insensitive) or canonical fields; "message" = the raw line
#   matches: regex (case-insensitive) that one of those fields must match
event_semantics:
  - name: auth_failure
    event_type: "auth:fail"
    action: failure
    all:
      - {fields: [action, operation, event, event_name, eventname, activity, category, type, msg, message, method, op],
         matches: 'log[ _-]?(on|in)|sign[ _-]?in|auth|session|credential|password|ssh|rdp|vpn|kerberos|ntlm'}
      - {fields: [status, result, outcome, action, operation, event, event_name, reason, msg, message, op],
         matches: '\b(fail|failed|failure|denied|deny|reject|rejected|invalid|bad[ _-]?pass\w*|locked|unauthori[sz]ed)\b|_(fail|failed|failure|denied)\b'}
  - name: auth_success
    event_type: "auth:success"
    action: success
    all:
      - {fields: [action, operation, event, event_name, eventname, activity, category, type, msg, message, method, op],
         matches: 'log[ _-]?(on|in)|sign[ _-]?in|auth|session|credential|ssh|rdp|vpn'}
      - {fields: [status, result, outcome, action, operation, event, event_name, msg, message, op],
         matches: '\b(success|succeeded|successful|accepted|granted|allowed|ok)\b|_(success|succeeded|ok)\b'}
      - {not_fields: [status, result, outcome, action, operation, event, event_name, reason, msg, message, op],
         matches: '\b(fail|failed|failure|denied|reject|invalid)\b|_(fail|failed|failure|denied)\b'}
  - name: process_start
    event_type: "sysmon:1"
    all:
      - {fields: [action, operation, event, event_name, activity, type, op],
         matches: 'exec|spawn|process[ _-]?(start|creat|launch)|proc[ _-]?start|command[ _-]?run'}
      - {fields: [process, cmdline], matches: '.'}
  - name: file_write
    event_type: "sysmon:11"
    all:
      - {fields: [action, operation, event, event_name, activity, type, op],
         matches: 'file[ _-]?(creat|writ|modif|renam|drop)'}
      - {fields: [target], matches: '.'}
  - name: account_created
    event_type: "account:create"
    all:
      - {fields: [action, operation, event, event_name, activity, op, msg, message],
         matches: '(user|account)[ _-]?(add|added|creat|created|new)|(add|creat|new)[ _-]?(user|account)'}
